server:
  port: 8090

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ruta-huespedes
              uri: lb://huespedes
              predicates:
                - Path=/api/huespedes/**

            - id: ruta-reservas
              uri: lb://reservas
              predicates:
                - Path=/api/reservas/**

            - id: ruta-habitaciones
              uri: lb://habitaciones
              predicates:
                - Path=/api/habitaciones/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:4200"
                allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
                allowed-headers: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true