<mat-toolbar color="primary">
  <span>Huéspedes</span>
  <span class="spacer"></span>
  <button mat-raised-button color="accent" (click)="abrirFormulario()">
    <mat-icon>person_add</mat-icon> Nuevo huésped
  </button>
</mat-toolbar>

<div class="loading" *ngIf="cargando">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<table mat-table [dataSource]="huespedes" *ngIf="!cargando" class="mat-elevation-z2">

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let h">{{ h.nombre }} {{ h.apellido }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let h">{{ h.email }}</td>
  </ng-container>

  <ng-container matColumnDef="telefono">
    <th mat-header-cell *matHeaderCellDef>Teléfono</th>
    <td mat-cell *matCellDef="let h">{{ h.telefono }}</td>
  </ng-container>

  <ng-container matColumnDef="documento">
    <th mat-header-cell *matHeaderCellDef>Documento</th>
    <td mat-cell *matCellDef="let h">{{ getTipoDocumentoLabel(h.tipoDocumento) }} - {{ h.numeroDocumento }}</td>
  </ng-container>

  <ng-container matColumnDef="nacionalidad">
    <th mat-header-cell *matHeaderCellDef>Nacionalidad</th>
    <td mat-cell *matCellDef="let h">{{ h.nacionalidad }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let h">
      <button mat-icon-button color="primary" matTooltip="Editar" (click)="abrirFormulario(h)">
        <mat-icon>edit</mat-icon>
      </button>
      <!-- Solo ADMIN ve el botón de eliminar -->
      <button mat-icon-button color="warn" matTooltip="Eliminar" *ngIf="isAdmin" (click)="eliminar(h)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
</table>

<p *ngIf="!cargando && huespedes.length === 0" class="sin-datos">
  No se encontraron huéspedes registrados.
</p>
