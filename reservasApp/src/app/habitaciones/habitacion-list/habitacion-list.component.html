<mat-toolbar color="primary"><span>Habitaciones</span><span class="spacer"></span>
  <button *ngIf="isAdmin" mat-raised-button color="accent" (click)="abrirFormulario()"><mat-icon>add</mat-icon> Nueva habitación</button></mat-toolbar>
<div class="loading" *ngIf="cargando"><mat-spinner diameter="40"></mat-spinner></div>
<table mat-table [dataSource]="habitaciones" *ngIf="!cargando" class="mat-elevation-z2">
  <ng-container matColumnDef="numero"><th mat-header-cell *matHeaderCellDef>Número</th><td mat-cell *matCellDef="let h">{{ h.numero }}</td></ng-container>
  <ng-container matColumnDef="tipo"><th mat-header-cell *matHeaderCellDef>Tipo</th><td mat-cell *matCellDef="let h">{{ etiquetaTipo(h.tipoHabitacion) }}</td></ng-container>
  <ng-container matColumnDef="precio"><th mat-header-cell *matHeaderCellDef>Precio</th><td mat-cell *matCellDef="let h">{{ h.precio | currency:'MXN' }}</td></ng-container>
  <ng-container matColumnDef="capacidad"><th mat-header-cell *matHeaderCellDef>Capacidad</th><td mat-cell *matCellDef="let h">{{ h.capacidad }}</td></ng-container>
  <ng-container matColumnDef="estado"><th mat-header-cell *matHeaderCellDef>Estado</th><td mat-cell *matCellDef="let h">{{ etiquetaEstado(h.estadoHabitacion) }}</td></ng-container>
  <ng-container matColumnDef="acciones"><th mat-header-cell *matHeaderCellDef>Acciones</th><td mat-cell *matCellDef="let h">
    <button mat-icon-button matTooltip="Consultar" (click)="consultar(h)"><mat-icon>visibility</mat-icon></button>
    <ng-container *ngIf="isAdmin">
      <button mat-icon-button color="primary" matTooltip="Editar" (click)="abrirFormulario(h)"><mat-icon>edit</mat-icon></button>
      <button mat-icon-button matTooltip="Cambiar estado" [disabled]="h.estadoHabitacion === 'OCUPADA'" (click)="cambiarEstado(h)"><mat-icon>sync</mat-icon></button>
      <button mat-icon-button color="warn" matTooltip="Eliminar" [disabled]="h.estadoHabitacion === 'OCUPADA'" (click)="eliminar(h)"><mat-icon>delete</mat-icon></button>
    </ng-container></td></ng-container>
  <tr mat-header-row *matHeaderRowDef="columnas"></tr><tr mat-row *matRowDef="let row; columns: columnas;"></tr>
</table>
<p *ngIf="!cargando && habitaciones.length === 0" class="sin-datos">No se encontraron habitaciones registradas.</p>
