<h2 mat-dialog-title>Cambiar estado</h2>
<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content>
    <p>Habitación {{ data.numero }} — {{ estadoActual }}</p>
    <mat-form-field appearance="outline" class="full-width"
      ><mat-label>Nuevo estado</mat-label>
      <mat-select formControlName="idEstado"
        ><mat-option *ngFor="let estado of estados" [value]="estado.id">{{
          estado.label
        }}</mat-option></mat-select
      >
      <mat-error>Selecciona un estado</mat-error></mat-form-field
    ></mat-dialog-content
  >
  <mat-dialog-actions align="end"
    ><button
      mat-button
      type="button"
      (click)="cancelar()"
      [disabled]="guardando"
    >
      Cancelar
    </button>
    <button
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="guardando || estados.length === 0"
    >
      Guardar
    </button></mat-dialog-actions
  >
</form>
